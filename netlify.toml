[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev -- --port 5190"
  targetPort = 5190
  port = 8889

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/stories"
  to = "/.netlify/functions/stories"
  status = 200

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/refresh-background"
  status = 200

[[redirects]]
  from = "/api/runs"
  to = "/.netlify/functions/runs"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
